- ros_topic_name: "thrust/fr"
  gz_topic_name: "/model/wcr/joint/FR_propeller_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "thrust/bl"
  gz_topic_name: "/model/wcr/joint/BL_propeller_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "thrust/br"
  gz_topic_name: "/model/wcr/joint/BR_propeller_joint/cmd_thrust"
